swagger: "2.0"
info:
  title: Task API
  description: API para gerenciamento de usuários e tarefas.
  version: "1.0.0"
basePath: /
consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: Informe o token como "Bearer <access_token>".

tags:
  - name: Health
    description: Verificação de saúde da API
  - name: Auth
    description: Autenticação e emissão de token de acesso
  - name: Tasks
    description: Operações de tarefas
  - name: Users
    description: Operações de usuários

paths:
  /health/:
    get:
      tags:
        - Health
      summary: Verifica a saúde da API
      operationId: healthCheck
      responses:
        "200":
          description: API funcionando
          schema:
            $ref: "#/definitions/HealthResponse"

  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autentica o usuário e emite um token
      description: Use o token retornado no cabeçalho Authorization das rotas protegidas.
      operationId: login
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/AuthCredentials"
      responses:
        "200":
          description: Login realizado
          schema:
            $ref: "#/definitions/AccessToken"
        "401":
          description: E-mail ou senha inválidos
          schema:
            $ref: "#/definitions/Error"

  /v1/tasks:
    post:
      tags:
        - Tasks
      summary: Cria uma tarefa
      description: O proprietário da tarefa é definido pelo usuário autenticado, não pelo corpo da requisição.
      operationId: createTask
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          description: Dados necessários para criar a tarefa.
          schema:
            $ref: "#/definitions/TaskCreate"
      responses:
        "201":
          description: Tarefa criada
          schema:
            $ref: "#/definitions/Task"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário associado ao token não encontrado
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"
    get:
      tags:
        - Tasks
      summary: Lista tarefas de um usuário
      description: >-
        Lista somente as tarefas do usuário autenticado. O parâmetro completed
        é opcional e filtra pelo estado de conclusão.
      operationId: getTasks
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: completed
          type: boolean
          required: false
          description: Filtra tarefas pelo estado de conclusão.
      responses:
        "200":
          description: Lista de tarefas
          schema:
            type: array
            items:
              $ref: "#/definitions/Task"
        "400":
          description: Parâmetros inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário associado ao token não encontrado
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"
    patch:
      tags:
        - Tasks
      summary: Atualiza uma tarefa
      description: Atualiza somente uma tarefa pertencente ao usuário autenticado.
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/TaskUpdate"
      responses:
        "200":
          description: Tarefa atualizada
          schema:
            $ref: "#/definitions/Task"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Tarefa não encontrada
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"

  /v1/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        type: integer
        description: Identificador da tarefa.
    get:
      tags:
        - Tasks
      summary: Busca uma tarefa pelo ID
      description: A tarefa só é retornada se pertencer ao usuário autenticado.
      operationId: getTaskById
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tarefa encontrada
          schema:
            $ref: "#/definitions/Task"
        "404":
          description: Tarefa não encontrada
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"
    delete:
      tags:
        - Tasks
      summary: Exclui uma tarefa
      description: Exclui somente uma tarefa pertencente ao usuário autenticado.
      operationId: deleteTask
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Tarefa excluída ou inexistente
        "400":
          description: Tarefa inválida
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"

  /v1/users:
    post:
      tags:
        - Users
      summary: Cria um usuário
      operationId: createUser
      parameters:
        - in: body
          name: body
          required: true
          description: Dados necessários para criar o usuário.
          schema:
            $ref: "#/definitions/UserCreate"
      responses:
        "201":
          description: Usuário criado
          schema:
            $ref: "#/definitions/User"
        "400":
          description: Corpo ausente, inválido ou com dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Erro ao cadastrar usuário
          schema:
            $ref: "#/definitions/Error"
    patch:
      tags:
        - Users
      summary: Atualiza um usuário
      description: Atualiza o cadastro do usuário autenticado.
      operationId: updateUser
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/UserUpdate"
      responses:
        "200":
          description: Usuário atualizado
          schema:
            $ref: "#/definitions/User"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"

  /v1/users/{user_id}:
    get:
      tags:
        - Users
      summary: Busca um usuário por ID ou e-mail
      description: >-
        A rota aceita um identificador numérico para buscar por ID ou um valor
        textual para buscar por e-mail. A aplicação seleciona a rota pelo tipo
        do valor recebido.
      operationId: getUserByIdOrEmail
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          type: string
          description: ID numérico do usuário ou endereço de e-mail.
      responses:
        "200":
          description: Usuário encontrado
          schema:
            $ref: "#/definitions/User"
        "404":
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"

  /v1/users/:
    delete:
      tags:
        - Users
      summary: Exclui o usuário autenticado
      description: A exclusão falha se o usuário possuir tarefas associadas.
      operationId: deleteUser
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Usuário excluído
        "404":
          description: Usuário não encontrado ou possui tarefas associadas
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Token ausente ou inválido
          schema:
            $ref: "#/definitions/JwtError"

definitions:
  HealthResponse:
    type: object
    properties:
      status:
        type: string
        example: healthy
    required:
      - status

  AuthCredentials:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        description: E-mail cadastrado.
      password:
        type: string
        format: password
        description: Senha da conta.

  AccessToken:
    type: object
    required:
      - access_token
      - token_type
    properties:
      access_token:
        type: string
        description: JWT de acesso.
      token_type:
        type: string
        example: Bearer

  TaskCreate:
    type: object
    required:
      - title
      - description
    properties:
      title:
        type: string
        description: Nome da tarefa.
        maxLength: 50
      description:
        type: string
        description: Descrição da tarefa.
      completed:
        type: boolean
        description: Estado de conclusão.
        default: false

  TaskUpdate:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
        description: Identificador da tarefa.
      title:
        type: string
        description: Novo nome da tarefa.
        maxLength: 50
      description:
        type: string
        description: Nova descrição da tarefa.
      completed:
        type: boolean
        description: Novo estado de conclusão.

  Task:
    type: object
    required:
      - id
      - title
      - description
      - completed
      - user_id
    properties:
      id:
        type: integer
        description: Identificador da tarefa.
      title:
        type: string
        description: Nome da tarefa.
      description:
        type: string
        description: Descrição da tarefa.
      completed:
        type: boolean
        description: Estado de conclusão.
      user_id:
        type: integer
        description: Identificador do usuário proprietário.

  UserCreate:
    type: object
    required:
      - name
      - email
      - password
    properties:
      name:
        type: string
        description: Nome do usuário.
        maxLength: 50
      email:
        type: string
        format: email
        description: E-mail do usuário.
      password:
        type: string
        description: Senha do usuário.

  UserUpdate:
    type: object
    required:
      - id
      - password
    properties:
      id:
        type: integer
        description: Identificador do usuário.
      name:
        type: string
        description: Novo nome do usuário.
        maxLength: 50
      email:
        type: string
        format: email
        description: Novo e-mail do usuário.
      password:
        type: string
        description: Senha do usuário.

  User:
    type: object
    required:
      - id
      - name
      - email
      - password
    properties:
      id:
        type: integer
        description: Identificador do usuário.
      name:
        type: string
        description: Nome do usuário.
      email:
        type: string
        format: email
        description: E-mail do usuário.
      password:
        type: string
        description: Senha retornada atualmente pela API.

  Error:
    type: object
    properties:
      error:
        type: string
        description: Mensagem de erro.

  JwtError:
    type: object
    properties:
      msg:
        type: string
        description: Motivo pelo qual o token foi rejeitado.

  ValidationError:
    type: object
    properties:
      error:
        type: string
        description: Resumo do erro de validação.
      details:
        type: array
        items:
          type: object
          additionalProperties: true

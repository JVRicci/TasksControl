swagger: "2.0"
info:
  title: Task API
  description: API para gerenciamento de usuários e tarefas.
  version: "1.0.0"
basePath: /
consumes:
  - application/json
produces:
  - application/json

tags:
  - name: Health
    description: Verificação de saúde da API
  - name: Tasks
    description: Operações de tarefas
  - name: Users
    description: Operações de usuários

paths:
  /health/:
    get:
      tags:
        - Health
      summary: Verifica a saúde da API
      operationId: healthCheck
      responses:
        "200":
          description: API funcionando
          schema:
            $ref: "#/definitions/HealthResponse"

  /v1/tasks:
    post:
      tags:
        - Tasks
      summary: Cria uma tarefa
      operationId: createTask
      parameters:
        - in: body
          name: body
          required: true
          description: Dados necessários para criar a tarefa.
          schema:
            $ref: "#/definitions/TaskCreate"
      responses:
        "201":
          description: Tarefa criada
          schema:
            $ref: "#/definitions/Task"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário informado não encontrado
          schema:
            $ref: "#/definitions/Error"
    get:
      tags:
        - Tasks
      summary: Lista tarefas de um usuário
      description: >-
        Informe user_id para listar as tarefas do usuário. O parâmetro
        completed é opcional, mas só pode ser informado junto com user_id.
      operationId: getTasks
      parameters:
        - in: query
          name: user_id
          type: integer
          required: false
          description: Identificador do usuário.
        - in: query
          name: completed
          type: boolean
          required: false
          description: Filtra tarefas pelo estado de conclusão.
      responses:
        "200":
          description: Lista de tarefas
          schema:
            type: array
            items:
              $ref: "#/definitions/Task"
        "400":
          description: Parâmetros inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário informado não encontrado
          schema:
            $ref: "#/definitions/Error"
    patch:
      tags:
        - Tasks
      summary: Atualiza uma tarefa
      description: O campo id identifica a tarefa; os demais campos podem ser enviados para atualização.
      operationId: updateTask
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/TaskUpdate"
      responses:
        "200":
          description: Tarefa atualizada
          schema:
            $ref: "#/definitions/Task"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Tarefa não encontrada
          schema:
            $ref: "#/definitions/Error"

  /v1/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        type: integer
        description: Identificador da tarefa.
    get:
      tags:
        - Tasks
      summary: Busca uma tarefa pelo ID
      operationId: getTaskById
      responses:
        "200":
          description: Tarefa encontrada
          schema:
            $ref: "#/definitions/Task"
        "404":
          description: Tarefa não encontrada
          schema:
            $ref: "#/definitions/Error"
    delete:
      tags:
        - Tasks
      summary: Exclui uma tarefa
      operationId: deleteTask
      responses:
        "204":
          description: Tarefa excluída ou inexistente
        "400":
          description: Tarefa inválida
          schema:
            $ref: "#/definitions/Error"

  /v1/users:
    post:
      tags:
        - Users
      summary: Cria um usuário
      operationId: createUser
      parameters:
        - in: body
          name: body
          required: true
          description: Dados necessários para criar o usuário.
          schema:
            $ref: "#/definitions/UserCreate"
      responses:
        "201":
          description: Usuário criado
          schema:
            $ref: "#/definitions/User"
        "400":
          description: Corpo ausente, inválido ou com dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Erro ao cadastrar usuário
          schema:
            $ref: "#/definitions/Error"
    patch:
      tags:
        - Users
      summary: Atualiza um usuário
      description: O campo id identifica o usuário; password é obrigatório no corpo da requisição.
      operationId: updateUser
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/UserUpdate"
      responses:
        "200":
          description: Usuário atualizado
          schema:
            $ref: "#/definitions/User"
        "400":
          description: Dados inválidos
          schema:
            $ref: "#/definitions/ValidationError"
        "404":
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"

  /v1/users/{user_id}:
    get:
      tags:
        - Users
      summary: Busca um usuário por ID ou e-mail
      description: >-
        A rota aceita um identificador numérico para buscar por ID ou um valor
        textual para buscar por e-mail. A aplicação seleciona a rota pelo tipo
        do valor recebido.
      operationId: getUserByIdOrEmail
      parameters:
        - name: user_id
          in: path
          required: true
          type: string
          description: ID numérico do usuário ou endereço de e-mail.
      responses:
        "200":
          description: Usuário encontrado
          schema:
            $ref: "#/definitions/User"
        "404":
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"
    delete:
      tags:
        - Users
      summary: Exclui um usuário
      description: A exclusão falha se o usuário possuir tarefas associadas.
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: Identificador do usuário.
      responses:
        "204":
          description: Usuário excluído
        "404":
          description: Usuário não encontrado ou possui tarefas associadas
          schema:
            $ref: "#/definitions/Error"

definitions:
  HealthResponse:
    type: object
    properties:
      status:
        type: string
        example: healthy
    required:
      - status

  TaskCreate:
    type: object
    required:
      - title
      - description
      - user_id
    properties:
      title:
        type: string
        description: Nome da tarefa.
        maxLength: 50
      description:
        type: string
        description: Descrição da tarefa.
      completed:
        type: boolean
        description: Estado de conclusão.
        default: false
      user_id:
        type: integer
        description: Identificador do usuário proprietário.

  TaskUpdate:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
        description: Identificador da tarefa.
      title:
        type: string
        description: Novo nome da tarefa.
        maxLength: 50
      description:
        type: string
        description: Nova descrição da tarefa.
      completed:
        type: boolean
        description: Novo estado de conclusão.

  Task:
    type: object
    required:
      - id
      - title
      - description
      - completed
      - user_id
    properties:
      id:
        type: integer
        description: Identificador da tarefa.
      title:
        type: string
        description: Nome da tarefa.
      description:
        type: string
        description: Descrição da tarefa.
      completed:
        type: boolean
        description: Estado de conclusão.
      user_id:
        type: integer
        description: Identificador do usuário proprietário.

  UserCreate:
    type: object
    required:
      - name
      - email
      - password
    properties:
      name:
        type: string
        description: Nome do usuário.
        maxLength: 50
      email:
        type: string
        format: email
        description: E-mail do usuário.
      password:
        type: string
        description: Senha do usuário.

  UserUpdate:
    type: object
    required:
      - id
      - password
    properties:
      id:
        type: integer
        description: Identificador do usuário.
      name:
        type: string
        description: Novo nome do usuário.
        maxLength: 50
      email:
        type: string
        format: email
        description: Novo e-mail do usuário.
      password:
        type: string
        description: Senha do usuário.

  User:
    type: object
    required:
      - id
      - name
      - email
      - password
    properties:
      id:
        type: integer
        description: Identificador do usuário.
      name:
        type: string
        description: Nome do usuário.
      email:
        type: string
        format: email
        description: E-mail do usuário.
      password:
        type: string
        description: Senha retornada atualmente pela API.

  Error:
    type: object
    properties:
      error:
        type: string
        description: Mensagem de erro.

  ValidationError:
    type: object
    properties:
      error:
        type: string
        description: Resumo do erro de validação.
      details:
        type: array
        items:
          type: object
          additionalProperties: true
